<script>
(function () {
  /* ---------- Publications: expand / collapse earlier work ---------- */
  function initPubToggle() {
    var btn = document.getElementById('pubs-toggle');
    var older = document.getElementById('pubs-older');
    if (!btn || !older) return;
    btn.addEventListener('click', function () {
      var open = older.style.display !== 'none';
      older.style.display = open ? 'none' : 'block';
      var sign = btn.querySelector('[data-sign]');
      var label = btn.querySelector('[data-label]');
      if (sign) sign.textContent = open ? '+' : '−';
      if (label) label.textContent = open ? btn.getAttribute('data-label-show') : 'Hide earlier work';
    });
  }

  /* ---------- Hero: travelling waves over an fBm habitat ----------
     Port of TW_animation.R. Three sources emit waves whose speed depends
     on an underlying habitat layer z:

       zeta_j = b0 + b1 * z
       D_j    = -sqrt((xj - x)^2 + (yj - y)^2)
       rho_j  = t + (1 / zeta_j) * D_j
       mu     = (2 + sin r0)^2 - (2 - sin r1)^2 + (1.5 + sin r2) * sin(0.7 r2)

     D_j and zeta_j are independent of t, so c_j = D_j / zeta_j is
     precomputed per cell and each frame only needs sin(t + c_j).
  ------------------------------------------------------------------ */
  var CELL = 6;                 // tile size in CSS px; a 600px square gives a 100x100 grid
  var UNITS_W = 100;            // model units across the field, whatever its pixel size
  var SPEED = 1.6;              // radians of t per second
  var SEED = 1988;
  // Fractions of the field. On the square these resolve to the original
  // TW_animation.R coordinates: (25,60), (40,15), (78,48) over a 100x100 domain.
  var SOURCES = [
    { fx: 0.25, fy: 0.60, b0: 0.4, b1: 5 },
    { fx: 0.40, fy: 0.15, b0: 0.3, b1: 6 },
    { fx: 0.78, fy: 0.48, b0: 0.4, b1: 4 }
  ];
  // ink -> amber-deep -> amber, matching the Poster Press ramp
  var STOPS = [[0, 27, 27, 20], [0.55, 109, 85, 24], [1, 209, 149, 39]];

  // Pointer deforms the habitat z, not mu directly: raising z locally raises
  // zeta = b0 + b1*z, so the waves run faster there. That keeps the displayed
  // model true (z is already in it) instead of bolting on a 4th source.
  // Phase shift scales with D/zeta, so keep the bump small and smooth or the
  // far field jumps whole cycles and shimmers.
  // Response is very uneven by nature (dphi/dz scales with 1/zeta^2): ~0.2
  // cycles in good habitat vs several in poor. That is the model being honest,
  // and the poor-habitat cells are already near one wavelength per 4 cells.
  var AMP_MAX = 0.18;           // max delta-z under the pointer
  var SIGMA = 10;               // bump width, model units (field is 100 across)
  var EASE = 7;                 // amplitude easing, per second

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeLattice(rand, gw, gh) {
    var g = new Float32Array((gw + 1) * (gh + 1));
    for (var i = 0; i < g.length; i++) g[i] = rand();
    return function (x, y) {
      var x0 = Math.floor(x), y0 = Math.floor(y);
      var fx = x - x0, fy = y - y0;
      if (x0 >= gw) { x0 = gw - 1; fx = 1; }
      if (y0 >= gh) { y0 = gh - 1; fy = 1; }
      if (x0 < 0) { x0 = 0; fx = 0; }
      if (y0 < 0) { y0 = 0; fy = 0; }
      var sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      var i00 = y0 * (gw + 1) + x0, i10 = i00 + 1;
      var i01 = i00 + (gw + 1), i11 = i01 + 1;
      var a = g[i00] + (g[i10] - g[i00]) * sx;
      var b = g[i01] + (g[i11] - g[i01]) * sx;
      return a + (b - a) * sy;
    };
  }

  // fractional Brownian motion: summed octaves of value noise
  function makeHabitat(cols, rows, seed) {
    var rand = mulberry32(seed);
    var z = new Float32Array(cols * rows);
    var amp = 1, baseGX = 3, octaves = 5;
    for (var o = 0; o < octaves; o++) {
      var gx = baseGX * Math.pow(2, o);
      var gy = Math.max(1, Math.round(gx * rows / cols));
      var n = makeLattice(rand, gx, gy);
      for (var j = 0; j < rows; j++) {
        for (var i = 0; i < cols; i++) {
          z[j * cols + i] += amp * n(i / (cols - 1) * gx, j / (rows - 1) * gy);
        }
      }
      amp *= 0.5;
    }
    var mn = Infinity, mx = -Infinity, k;
    for (k = 0; k < z.length; k++) { if (z[k] < mn) mn = z[k]; if (z[k] > mx) mx = z[k]; }
    var span = (mx - mn) || 1;
    for (k = 0; k < z.length; k++) z[k] = (z[k] - mn) / span;
    return z;
  }

  function buildLut() {
    var lut = new Uint8Array(256 * 3);
    for (var i = 0; i < 256; i++) {
      var t = i / 255, s = 0;
      while (s < STOPS.length - 2 && t > STOPS[s + 1][0]) s++;
      var a = STOPS[s], b = STOPS[s + 1];
      var u = (t - a[0]) / ((b[0] - a[0]) || 1);
      if (u < 0) u = 0; if (u > 1) u = 1;
      lut[i * 3] = a[1] + (b[1] - a[1]) * u;
      lut[i * 3 + 1] = a[2] + (b[2] - a[2]) * u;
      lut[i * 3 + 2] = a[3] + (b[3] - a[3]) * u;
    }
    return lut;
  }

  function initWave() {
    var cv = document.getElementById('pp-wave');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d');
    var off = document.createElement('canvas');
    var offCtx = off.getContext('2d');
    var lut = buildLut();
    var cols = 0, rows = 0, unit = 1, domainH = 1;
    var Z, D0, D1, D2, c0, c1, c2, img, muMin = 0, muMax = 1;
    var ready = false, visible = true, raf = null, lastW = -1, lastH = -1;
    var amp = 0, ampTarget = 0, px = 0, py = 0, pointerMoved = false;

    function muAt(t, k) {
      var s0 = Math.sin(t + c0[k]);
      var s1 = Math.sin(t + c1[k]);
      var r2 = t + c2[k];
      var s2 = Math.sin(r2);
      return (2 + s0) * (2 + s0) - (2 - s1) * (2 - s1) + (1.5 + s2) * Math.sin(0.7 * r2);
    }

    function build() {
      var w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h) return false;
      if (w === lastW && h === lastH) return ready;
      lastW = w; lastH = h;

      cols = Math.max(8, Math.round(w / CELL));
      rows = Math.max(8, Math.round(h / CELL));
      off.width = cols; off.height = rows;
      img = offCtx.createImageData(cols, rows);

      var n = cols * rows;
      // Distances are measured in model units rather than cells, so the wave
      // keeps the same visual scale whatever the plate's pixel size.
      unit = UNITS_W / cols; domainH = rows * unit;
      Z = makeHabitat(cols, rows, SEED);

      // D_j never changes, so the sqrt is paid once here; only zeta moves when
      // the pointer deforms z, and that is a divide per cell.
      D0 = new Float32Array(n); D1 = new Float32Array(n); D2 = new Float32Array(n);
      var Ds = [D0, D1, D2];
      for (var s = 0; s < 3; s++) {
        var S = SOURCES[s], sx = S.fx * UNITS_W, sy = S.fy * domainH, arr = Ds[s];
        for (var j = 0; j < rows; j++) {
          for (var i = 0; i < cols; i++) {
            var dx = sx - i * unit, dy = sy - j * unit;
            arr[j * cols + i] = -Math.sqrt(dx * dx + dy * dy);
          }
        }
      }
      c0 = new Float32Array(n); c1 = new Float32Array(n); c2 = new Float32Array(n);
      amp = 0; ampTarget = 0; pointerMoved = false;
      recomputeField();

      // Fix the colour scale once, across a few phases (gganimate scales
      // globally). mu is bounded by its sines regardless of zeta, so the
      // pointer bump can never push it outside this range.
      muMin = Infinity; muMax = -Infinity;
      for (var ti = 0; ti < 4; ti++) {
        var t = ti * 1.7;
        for (var k2 = 0; k2 < n; k2++) {
          var m = muAt(t, k2);
          if (m < muMin) muMin = m;
          if (m > muMax) muMax = m;
        }
      }

      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.max(1, Math.round(w * dpr));
      cv.height = Math.max(1, Math.round(h * dpr));
      ready = true;
      return true;
    }

    // c_j = D_j / zeta_j, with a Gaussian bump in z under the pointer.
    // Only positive bumps: zeta must stay well clear of zero.
    function recomputeField() {
      var S0 = SOURCES[0], S1 = SOURCES[1], S2 = SOURCES[2];
      var a = amp, inv2s2 = 1 / (2 * SIGMA * SIGMA), cut = (3 * SIGMA) * (3 * SIGMA);
      for (var j = 0; j < rows; j++) {
        var y = j * unit;
        for (var i = 0; i < cols; i++) {
          var k = j * cols + i, ze = Z[k];
          if (a > 0) {
            var dx = px - i * unit, dy = py - y, r2 = dx * dx + dy * dy;
            if (r2 < cut) ze += a * Math.exp(-r2 * inv2s2);
          }
          c0[k] = D0[k] / (S0.b0 + S0.b1 * ze);
          c1[k] = D1[k] / (S1.b0 + S1.b1 * ze);
          c2[k] = D2[k] / (S2.b0 + S2.b1 * ze);
        }
      }
    }

    // Ease the bump in/out so the phase shift never snaps.
    function updateField(dt) {
      if (!ready) return;
      var prev = amp;
      if (amp !== ampTarget) {
        amp += (ampTarget - amp) * Math.min(1, dt * EASE);
        if (Math.abs(ampTarget - amp) < 0.0015) amp = ampTarget;
      }
      if (amp !== prev || (pointerMoved && amp > 0)) {
        recomputeField();
        pointerMoved = false;
      }
    }

    function draw(t) {
      if (!ready) return;
      var d = img.data, n = cols * rows, span = (muMax - muMin) || 1;
      for (var k = 0; k < n; k++) {
        var v = (muAt(t, k) - muMin) / span;
        v = v < 0 ? 0 : (v > 1 ? 1 : v);
        var p = ((v * 255) | 0) * 3, o = k * 4;
        d[o] = lut[p]; d[o + 1] = lut[p + 1]; d[o + 2] = lut[p + 2]; d[o + 3] = 255;
      }
      offCtx.putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(off, 0, 0, cv.width, cv.height);
    }

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var start = null, lastTs = null;
    function frame(ts) {
      raf = null;
      if (start === null) { start = ts; lastTs = ts; }
      var dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;
      updateField(dt);
      draw(((ts - start) / 1000) * SPEED);
      if (visible && !reduce) raf = requestAnimationFrame(frame);
    }
    function play() {
      if (raf === null && visible && !reduce && ready) raf = requestAnimationFrame(frame);
    }

    // Pointer raises z locally; the waves speed up under the cursor. Skipped
    // entirely under reduced-motion, and absent on touch-only devices, where
    // it degrades to the plain animation.
    if (!reduce) {
      var onMove = function (e) {
        var r = cv.getBoundingClientRect();
        if (!r.width || !r.height) return;
        px = (e.clientX - r.left) / r.width * UNITS_W;
        py = (e.clientY - r.top) / r.height * domainH;
        ampTarget = AMP_MAX;
        pointerMoved = true;
        play();
      };
      var onLeave = function () { ampTarget = 0; play(); };
      cv.addEventListener('pointerenter', onMove);
      cv.addEventListener('pointermove', onMove);
      cv.addEventListener('pointerleave', onLeave);
      cv.addEventListener('pointercancel', onLeave);
      cv.addEventListener('pointerup', onLeave);
    }

    // The canvas has no layout size until the page is actually rendered, which
    // never happens while the tab is in the background. Keep retrying rather
    // than giving up, or a background-tab load leaves the hero blank forever.
    function tryStart() {
      if (!build()) return false;
      draw(0);
      play();
      return true;
    }

    var io = null;
    if ('IntersectionObserver' in window) {
      io = new IntersectionObserver(function (entries) {
        visible = entries[0].isIntersecting;
        if (visible) play();
        else if (raf !== null) { cancelAnimationFrame(raf); raf = null; }
      }, { threshold: 0 });
      io.observe(cv);
    }

    if (!tryStart()) {
      var tries = 0;
      var iv = setInterval(function () {
        if (tryStart() || ++tries > 80) clearInterval(iv);
      }, 250);
    }
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) tryStart();
    });

    // Watch the canvas box itself, not just the window: the plate's clamp()
    // height can change without a window resize (e.g. late font layout).
    var rt = null, ro = null;
    function scheduleRebuild() {
      clearTimeout(rt);
      rt = setTimeout(function () { if (build()) { draw(0); play(); } }, 200);
    }
    if ('ResizeObserver' in window) {
      ro = new ResizeObserver(scheduleRebuild);
      ro.observe(cv);
    } else {
      window.addEventListener('resize', scheduleRebuild);
    }
  }

  function init() { initPubToggle(); initWave(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
