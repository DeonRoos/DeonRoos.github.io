project:
  type: website
  post-render: remove-polyfill.R
  resources:
    - media/mu_wave.mp4
    - media/distributions.png
    - media/house_price.png
    - media/rent.png
    - media/acceptances.jpeg
    - media/applications.jpeg
    - media/occupancy.PNG
    - media/Bluesky_Logo.svg
    - media/wordcloud_stm.png
    - media/warbler.png
    - media/glm_binomial_illustration.png
    - favicon.svg
    - theses/**
    - scripts/**
    - media/sites/**

website:
  title: "Deon Roos"
  favicon: favicon.svg
  description: "Lecturer in Applied Statistics | Data Visualisation | Statistics Course | Statistical Distributions"

format:
  html:
    theme: default
    css:
      - poster-press.css
    highlight-style: atom-one-dark
    code-fold: true
    toc: false
    anchor-sections: false
    mermaid:
      theme: dark
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Anton&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
    include-before-body:
      - _pp-nav.html
    include-after-body:
      - _pp-footer.html

publish:
  provider: gh-pages
  branch: gh-pages
